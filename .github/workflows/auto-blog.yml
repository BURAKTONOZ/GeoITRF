name: Günlük Otomatik SEO Makale Üretici

on:
  schedule:
    - cron: '0 6 * * *' # Her gün saat 06:00 UTC'de (Türkiye saatiyle 09:00) otomatik çalışır
  workflow_dispatch: # GitHub panelinden "Run workflow" diyerek istediğin an elle de tetikleyebilmeni sağlar

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Kopyala
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Gerekli Kütüphaneleri Yükle
        run: npm install @google/genai firebase-admin

      - name: Gemini ile Makaleyi Üret ve Firebase'e Kaydet
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
        run: node scripts/generate-article.js
