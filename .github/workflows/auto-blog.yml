name: Günde 3 Kez SEO Makale Üretici

on:
  schedule:
    # ===== GEÇİCİ TEST: schedule çalışıyor mu görmek için. Görünce bu satırı SİL =====
    - cron: '*/5 * * * *'
    # Asıl tetikler: TR 08:07, 12:11, 17:13 (UTC 05:07, 09:11, 14:13)
    - cron: '7 5 * * *'
    - cron: '11 9 * * *'
    - cron: '13 14 * * *'
    # Yedek tetikler: asıl tetik düşerse devreye girer (script 150 dk kuralıyla çift yazımı engeller)
    - cron: '47 5 * * *'
    - cron: '51 9 * * *'
    - cron: '53 14 * * *'
  workflow_dispatch:

concurrency:
  group: auto-blog
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - name: Repoyu Kopyala
        uses: actions/checkout@v4

      - name: Zamanlanmış Workflow Kapanmasın (60 gün kuralı)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/auto-blog.yml/enable"

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Gerekli Kütüphaneleri Yükle
        run: npm install @google/genai firebase-admin --no-audit --no-fund

      - name: Gemini ile Makaleyi Üret ve Firebase'e Kaydet
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
        run: node scripts/generate-article.js