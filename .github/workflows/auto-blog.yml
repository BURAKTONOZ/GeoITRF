name: Günde 4 Kez SEO Makale Üretici

on:
  schedule:
    # TR 07:30, 12:30, 17:30, 22:30  (UTC 04:30, 09:30, 14:30, 19:30)
    - cron: '30 4 * * *'
    - cron: '30 9 * * *'
    - cron: '30 14 * * *'
    - cron: '30 19 * * *'
  workflow_dispatch:

concurrency:
  group: auto-blog
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - name: Repoyu Kopyala
        uses: actions/checkout@v4

      - name: Zamanlanmış Workflow Kapanmasın (60 gün kuralı)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/auto-blog.yml/enable"

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Gerekli Kütüphaneleri Yükle
        run: npm install @google/genai firebase-admin --no-audit --no-fund

      - name: Gemini ile Makaleyi Üret ve Firebase'e Kaydet
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
        run: node scripts/generate-article.js