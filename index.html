<!-- CREAT BY TONOZ -->
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>GeoITRF - Mobil Terminal</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>

    <style>
        :root {
            --accent: #10b981; 
            --danger: #ef4444;
            --primary: #3b82f6;
            --dark-glass: rgba(15, 23, 42, 0.85);
            --border-glass: rgba(255,255,255,0.1);
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            font-family: 'Poppins', sans-serif; overflow: hidden; background-color: #000;
        }

        #map { width: 100vw; height: 100vh; z-index: 1; }
        .leaflet-control-zoom { display: none; }

        /* Dinamik Animasyonlu Üst Panel */
        .top-bar {
            position: absolute; top: 15px; left: 15px; right: 15px; z-index: 1000;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            padding: 15px; border-radius: 20px; border: 1px solid var(--border-glass);
            display: flex; flex-direction: column; gap: 10px; color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-height: 200px; transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1); overflow: hidden;
        }
        .top-bar.minimized { max-height: 52px; padding-bottom: 12px; } /* Menü açılınca daralır */

        .top-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-glass); padding-bottom: 8px;}
        .brand-box { display: flex; flex-direction: column; }
        .brand-box h1 { font-size: 1.1rem; margin: 0; font-weight: 700; color: var(--accent); letter-spacing: 0.5px; line-height: 1.1;}
        .brand-box .creator { font-size: 0.55rem; color: rgba(255,255,255,0.5); font-weight: 700; letter-spacing: 1.5px; margin-top:2px;}
        
        .gps-status { font-size: 0.8rem; font-weight: 600; color: #cbd5e1; display: flex; align-items: center; gap: 6px; }
        .gps-status span { color: var(--accent); }
        .blink { animation: blinker 1.5s linear infinite; color: var(--accent); }
        @keyframes blinker { 50% { opacity: 0.3; } }
        
        .live-data-container { 
            display: flex; justify-content: space-between; gap: 10px; 
            transition: all 0.3s ease; opacity: 1; transform: translateY(0);
        }
        .top-bar.minimized .live-data-container { opacity: 0; transform: translateY(-10px); pointer-events: none; margin-top: -10px;}
        
        .live-col { flex: 1; display: flex; flex-direction: column; }
        .live-col:last-child { text-align: right; }
        .live-label { color: #94a3b8; font-size: 0.65rem; text-transform: uppercase; font-weight: 600; margin-bottom: 3px;}
        .live-val { font-family: monospace; font-size: 0.85rem; font-weight: 600; color: #fff; line-height: 1.3;}
        .live-val span { color: var(--primary); }

        /* Sağ Kontroller */
        .right-controls {
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
            z-index: 1000; display: flex; flex-direction: column; gap: 12px; transition: 0.4s ease;
        }
        .right-controls.hidden { opacity: 0; pointer-events: none; transform: translateY(-50%) scale(0.9); }
        .map-btn {
            width: 45px; height: 45px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.15);
            background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            color: white; font-size: 1.2rem; cursor: pointer; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: all 0.3s ease;
        }
        .map-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.2); }

        /* Harita Marker Pop-up Özel Tasarımı */
        .leaflet-popup-content-wrapper { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); color: #fff; border-radius: 12px; border: 1px solid var(--border-glass); }
        .leaflet-popup-tip { background: rgba(15, 23, 42, 0.9); }
        .marker-popup { font-family: 'Poppins', sans-serif; text-align: left; }
        .marker-popup h3 { color: var(--accent); margin: 0 0 2px 0; font-size: 1.1rem; }
        .marker-popup p { margin: 0; font-size: 0.8rem; color: #94a3b8;}
        .marker-popup hr { border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 8px 0; }
        .marker-popup .coords b { color: #fff; }
        .marker-popup .coords { font-size: 0.85rem; font-family: monospace; line-height: 1.4; color: var(--primary);}

        /* Instagram Tarzı Pill Dock */
        .ig-dock-wrapper {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            z-index: 1100; width: 92%; max-width: 380px;
        }
        .ig-dock {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(15, 15, 15, 0.9); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,0.08); border-radius: 50px;
            padding: 6px; box-shadow: 0 20px 40px rgba(0,0,0,0.7);
        }
        .ig-dock-item {
            position: relative; width: 65px; height: 50px;
            display: flex; justify-content: center; align-items: center;
            border-radius: 40px; color: rgba(255,255,255,0.5); font-size: 1.3rem;
            cursor: pointer; transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .ig-dock-item.active { color: #fff; background: rgba(255, 255, 255, 0.15); }
        .ig-dock-item:active { transform: scale(0.9); }
        
        .profile-pic {
            width: 30px; height: 30px; border-radius: 50%; object-fit: cover;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex; justify-content: center; align-items: center; 
            font-size: 0.9rem; color: white; font-weight: 700;
            border: 2px solid transparent; transition: 0.3s;
        }
        .ig-dock-item.active .profile-pic { border-color: #fff; }

        /* Modallar (Üst bar daraldığında top: 80px'e çıkar) */
        .app-modal {
            position: absolute; top: 150px; bottom: 110px; left: 15px; right: 15px;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border-radius: 24px; border: 1px solid var(--border-glass); z-index: 999;
            opacity: 0; pointer-events: none; transform: scale(0.95); transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .app-modal.show { opacity: 1; pointer-events: all; transform: scale(1); top: 80px; } /* Animasyonlu yukarı kayma */
        .modal-header { padding: 20px; border-bottom: 1px solid var(--border-glass); color: white; font-weight: 600; display:flex; justify-content: space-between; align-items: center;}
        .modal-header-actions i { cursor: pointer; color: #94a3b8; font-size: 1.2rem; transition: 0.2s; margin-left: 15px;}
        .modal-header-actions i:hover { color: #fff; }
        .modal-body { padding: 20px; overflow-y: auto; flex: 1; }

        /* Kayıt Formu (Floating) */
        .floating-save-panel {
            position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(20px);
            z-index: 1000; background: rgba(0,0,0,0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass); border-radius: 20px; padding: 20px;
            display: flex; flex-direction: column; gap: 12px; width: 90%; max-width: 400px;
            opacity: 0; pointer-events: none; transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }
        .floating-save-panel.show { opacity: 1; pointer-events: all; transform: translateX(-50%) translateY(0); }
        .save-header { color: #fff; font-size: 0.9rem; font-weight: 600; display: flex; justify-content: space-between; }
        .save-header span { color: var(--accent); }
        .input-group { display: flex; gap: 10px; }
        .floating-save-panel input {
            flex: 1; padding: 15px; border-radius: 14px; border: 1px solid var(--border-glass);
            background: rgba(255, 255, 255, 0.05); color: white; font-size: 1rem; outline: none; font-weight: 600; transition: 0.3s;
        }
        .floating-save-panel input:focus { background: rgba(255,255,255,0.1); border-color: var(--primary); }
        .floating-save-panel button {
            background: var(--accent); color: white; border: none; padding: 0 25px;
            border-radius: 14px; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s;
        }

        /* Liste ve Proje Kartları */
        .card-item { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-glass); border-radius: 16px; padding: 15px; margin-bottom: 15px; color: white; display: flex; justify-content: space-between; align-items: center;}
        .card-info h4 { margin: 0 0 5px 0; font-size: 1.05rem; color: var(--primary); display:flex; align-items:center; gap:8px;}
        .itrf-coords { font-size: 0.9rem; margin: 0; font-weight: 600; letter-spacing: 0.5px;}
        .wgs-coords { margin: 5px 0 0 0; font-size: 0.75rem; color: #94a3b8; }
        .card-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; max-width: 100px;}
        .card-actions button { width: 38px; height: 38px; border-radius: 10px; border: none; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 1rem;}
        
        .btn-go { background: rgba(59, 130, 246, 0.2); color: var(--primary); }
        .btn-edit { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .btn-del { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        .btn-select { width: 100% !important; background: rgba(16, 185, 129, 0.2); color: var(--accent); font-weight: 600;}
        
        .project-input-row { display: flex; gap: 10px; margin-bottom: 20px; }
        .project-input-row input { flex:1; padding: 15px; border-radius: 14px; border: 1px solid var(--border-glass); background: rgba(255,255,255,0.05); color: white; outline: none;}
        .project-input-row button { padding: 0 25px; border-radius: 14px; border: none; background: var(--primary); color: white; cursor: pointer;}

        .empty-state { text-align: center; color: #94a3b8; font-size: 0.95rem; padding: 40px 10px; display: flex; flex-direction: column; gap: 15px; align-items: center;}
        .empty-state i { font-size: 3rem; opacity: 0.5; color: var(--primary);}

        /* Ayarlar Switch Butonları */
        .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid var(--border-glass); }
        .setting-row:last-child { border: none; }
        .setting-info h5 { margin: 0 0 5px 0; color: white; font-size: 1rem; }
        .setting-info p { margin: 0; color: #94a3b8; font-size: 0.8rem; }
        .toggle-btn { background: var(--border-glass); border: none; border-radius: 20px; width: 50px; height: 26px; position: relative; cursor: pointer; transition: 0.3s;}
        .toggle-btn::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; background: white; border-radius: 50%; transition: 0.3s;}
        .toggle-btn.active { background: var(--accent); }
        .toggle-btn.active::after { left: 27px; }

    </style>
</head>
<body>

    <div class="top-bar" id="top-bar">
        <div class="top-header">
            <div class="brand-box">
                <h1>GeoITRF</h1>
                <span class="creator">CREAT BY TONOZ</span>
            </div>
            <div class="gps-status"><i class="fas fa-satellite blink"></i> <span id="accuracy">Bekleniyor</span></div>
        </div>
        <div class="live-data-container" id="live-data">
            <div class="live-col">
                <span class="live-label">WGS84</span>
                <span class="live-val">E: <span id="live-lat">...</span></span>
                <span class="live-val">B: <span id="live-lon">...</span></span>
            </div>
            <div class="live-col">
                <span class="live-label" id="dom-label">ITRF96</span>
                <span class="live-val">Y: <span id="live-y">...</span></span>
                <span class="live-val">X: <span id="live-x">...</span></span>
            </div>
        </div>
    </div>

    <div class="right-controls" id="right-controls">
        <button class="map-btn" onclick="goToMyLocation()"><i class="fas fa-crosshairs" style="color:var(--primary);"></i></button>
        <button class="map-btn" onclick="map.zoomIn()"><i class="fas fa-plus"></i></button>
        <button class="map-btn" onclick="map.zoomOut()"><i class="fas fa-minus"></i></button>
    </div>

    <div id="map"></div>

    <!-- Kayıt Formu -->
    <div class="floating-save-panel" id="save-panel">
        <div class="save-header">Aktif Proje: <span id="active-project-label">Varsayılan</span></div>
        <div class="input-group">
            <input type="text" id="point-name" placeholder="Nokta Adı">
            <button onclick="saveCurrentLocation()"><i class="fas fa-check"></i></button>
        </div>
    </div>

    <!-- Liste Modalı -->
    <div class="app-modal" id="modal-list">
        <div class="modal-header">
            <span><i class="fas fa-list"></i> <span id="list-project-name">Varsayılan</span> (<span id="point-count">0</span>)</span>
            <div class="modal-header-actions">
                <i class="fas fa-download" onclick="exportToTXT()" title="TXT İndir"></i>
                <i class="fas fa-times" onclick="switchTab('tab-map')"></i>
            </div>
        </div>
        <div class="modal-body" id="points-list"></div>
    </div>

    <!-- Projeler Modalı -->
    <div class="app-modal" id="modal-projects">
        <div class="modal-header">
            <span><i class="fas fa-folder-open"></i> Projeler</span>
            <div class="modal-header-actions"><i class="fas fa-times" onclick="switchTab('tab-map')"></i></div>
        </div>
        <div class="modal-body">
            <div class="project-input-row">
                <input type="text" id="new-project-name" placeholder="Yeni Klasör Adı">
                <button onclick="createNewProject()"><i class="fas fa-plus"></i></button>
            </div>
            <div id="projects-list"></div>
        </div>
    </div>

    <!-- Ayarlar Modalı (Yeni) -->
    <div class="app-modal" id="modal-settings">
        <div class="modal-header">
            <span><i class="fas fa-cog"></i> Ayarlar</span>
            <div class="modal-header-actions"><i class="fas fa-times" onclick="switchTab('tab-map')"></i></div>
        </div>
        <div class="modal-body">
            <div class="setting-row">
                <div class="setting-info">
                    <h5>Uydu Görünümü</h5>
                    <p>Harita altlığını uydu olarak ayarla.</p>
                </div>
                <button class="toggle-btn active" id="btn-satellite" onclick="toggleMapLayer()"></button>
            </div>
            <div style="margin-top: 30px; border-top: 1px solid var(--border-glass); padding-top: 20px; color:#94a3b8; font-size:0.9rem;">
                <p style="color:white; font-weight:600; margin-bottom:10px;">Uygulama Bilgileri</p>
                <p><i class="fas fa-globe" style="width:20px;"></i> Koordinat: ITRF96 / WGS84</p>
                <p><i class="fas fa-ruler-combined" style="width:20px;"></i> DOM: Otomatik (3°)</p>
                <p><i class="fas fa-code" style="width:20px;"></i> Geliştirici: CREAT BY TONOZ</p>
            </div>
        </div>
    </div>

    <!-- INSTAGRAM TARZI PİLL DOCK -->
    <div class="ig-dock-wrapper">
        <div class="ig-dock">
            <div class="ig-dock-item active" id="tab-map" onclick="switchTab('tab-map')">
                <i class="fas fa-map-marked-alt"></i>
            </div>
            <div class="ig-dock-item" id="tab-projects" onclick="switchTab('tab-projects')">
                <i class="fas fa-folder"></i>
            </div>
            <div class="ig-dock-item" id="tab-add" onclick="switchTab('tab-add')">
                <i class="fas fa-plus-circle" style="font-size:1.6rem; color:var(--primary);"></i>
            </div>
            <div class="ig-dock-item" id="tab-list" onclick="switchTab('tab-list')">
                <i class="fas fa-list-ul"></i>
            </div>
            <div class="ig-dock-item" id="tab-settings" onclick="switchTab('tab-settings')">
                <i class="fas fa-cog"></i>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // --- Harita ve Altlık Katmanları Ayarları ---
        var map = L.map('map', { zoomControl: false }).setView([39.92, 32.85], 2); 
        
        var satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 });
        var streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 });
        
        satelliteLayer.addTo(map); // Varsayılan
        var isSatellite = true;

        function toggleMapLayer() {
            var btn = document.getElementById('btn-satellite');
            if(isSatellite) {
                map.removeLayer(satelliteLayer);
                streetLayer.addTo(map);
                btn.classList.remove('active');
            } else {
                map.removeLayer(streetLayer);
                satelliteLayer.addTo(map);
                btn.classList.add('active');
            }
            isSatellite = !isSatellite;
        }

        // --- Global Değişkenler ---
        var userMarker = null, firstLocationFound = false;
        var currentLat = null, currentLon = null, currentX = null, currentY = null, currentDOM = null;
        var pointMarkers = {}, pointIdCounter = 0;
        
        var projectsData = { "Varsayılan": { points: [], autoCounter: 1 } };
        var activeProject = "Varsayılan";

        function calculateITRF(lat, lon) {
            let dom = Math.round(lon / 3) * 3;
            let projString = `+proj=tmerc +lat_0=0 +lon_0=${dom} +k=1 +x_0=500000 +y_0=0 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs`;
            let result = proj4('WGS84', projString, [lon, lat]);
            return { y: result[0], x: result[1], dom: dom };
        }

        if ('geolocation' in navigator) {
            navigator.geolocation.watchPosition(function(position) {
                currentLat = position.coords.latitude; currentLon = position.coords.longitude;
                document.getElementById('live-lat').innerText = currentLat.toFixed(5);
                document.getElementById('live-lon').innerText = currentLon.toFixed(5);
                document.getElementById('accuracy').innerText = "± " + Math.round(position.coords.accuracy) + "m";

                let itrf = calculateITRF(currentLat, currentLon);
                currentY = itrf.y; currentX = itrf.x; currentDOM = itrf.dom;

                document.getElementById('dom-label').innerText = `ITRF96 (DOM ${currentDOM})`;
                document.getElementById('live-y').innerText = currentY.toFixed(3);
                document.getElementById('live-x').innerText = currentX.toFixed(3);

                var newLoc = new L.LatLng(currentLat, currentLon);
                if (userMarker) { userMarker.setLatLng(newLoc); } 
                else { userMarker = L.circleMarker(newLoc, { color: '#3b82f6', fillColor: '#3b82f6', fillOpacity: 0.8, radius: 8, weight: 2, zIndexOffset: 1000 }).addTo(map); }

                if (!firstLocationFound) { map.setView(newLoc, 18); firstLocationFound = true; }
            }, function(e) { document.getElementById('accuracy').innerText = "Hata!"; }, { enableHighAccuracy: true, maximumAge: 0 });
        }

        function goToMyLocation() {
            if (currentLat) { map.setView([currentLat, currentLon], 19); } else { alert("GPS Bekleniyor..."); }
        }

        // --- Ekran Animasyonları (Daralma İşlemi) ---
        function closeAllModals() {
            document.querySelectorAll('.app-modal, .floating-save-panel').forEach(el => el.classList.remove('show'));
            document.getElementById('top-bar').classList.remove('minimized');
            document.getElementById('right-controls').classList.remove('hidden');
        }

        function switchTab(tabId) {
            document.querySelectorAll('.ig-dock-item').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            closeAllModals();

            if (tabId !== 'tab-map') {
                document.getElementById('top-bar').classList.add('minimized');
                document.getElementById('right-controls').classList.add('hidden');
            }

            if (tabId === 'tab-projects') {
                document.getElementById('modal-projects').classList.add('show');
                updateProjectsUI();
            } else if (tabId === 'tab-add') {
                document.getElementById('save-panel').classList.add('show');
                document.getElementById('point-name').value = projectsData[activeProject].autoCounter.toString();
                setTimeout(() => document.getElementById('point-name').focus(), 100);
            } else if (tabId === 'tab-list') {
                document.getElementById('modal-list').classList.add('show');
                updateListUI();
            } else if (tabId === 'tab-settings') {
                document.getElementById('modal-settings').classList.add('show');
            }
        }

        // --- Proje ve Harita Nokta Yönetimi ---
        
        // Bu fonksiyon haritadaki noktaları günceller (Sadece aktif klasör)
        function renderActiveProjectMarkers() {
            // Önce haritadaki tüm nokta ikonlarını sil
            for (let id in pointMarkers) { map.removeLayer(pointMarkers[id]); }
            pointMarkers = {};

            // Sadece aktif projedeki noktaları haritaya çiz ve Pop-up ayarla
            projectsData[activeProject].points.forEach(p => {
                let popupContent = `
                    <div class="marker-popup">
                        <h3>${p.name}</h3>
                        <p><i class="fas fa-folder"></i> ${activeProject}</p>
                        <hr>
                        <div class="coords">
                            <b>Y:</b> ${p.y_saga.toFixed(3)}<br>
                            <b>X:</b> ${p.x_yukari.toFixed(3)}<br>
                            <b>Enlem:</b> ${p.lat.toFixed(6)}<br>
                            <b>Boylam:</b> ${p.lon.toFixed(6)}
                        </div>
                    </div>
                `;
                let marker = L.marker([p.lat, p.lon]).addTo(map).bindPopup(popupContent);
                pointMarkers[p.id] = marker;
            });
        }

        function createNewProject() {
            let input = document.getElementById("new-project-name");
            let name = input.value.trim();
            if(!name) return alert("Lütfen proje adı girin.");
            if(projectsData[name]) return alert("Bu isimde bir proje zaten var.");
            
            projectsData[name] = { points: [], autoCounter: 1 };
            activeProject = name;
            input.value = "";
            document.getElementById('active-project-label').innerText = activeProject;
            
            updateProjectsUI();
            renderActiveProjectMarkers(); // Yeni projede harita temizlenir
        }

        function setActiveProject(name) {
            activeProject = name;
            document.getElementById('active-project-label').innerText = activeProject;
            updateProjectsUI();
            renderActiveProjectMarkers(); // Aktif proje değişince haritayı güncelle
        }

        function updateProjectsUI() {
            let html = "";
            for (let projName in projectsData) {
                let count = projectsData[projName].points.length;
                let isActive = projName === activeProject;
                html += `
                    <div class="card-item" style="border-color: ${isActive ? 'var(--accent)' : 'var(--border-glass)'}; background: ${isActive ? 'rgba(16, 185, 129, 0.05)' : ''}">
                        <div class="card-info">
                            <h4 style="color: ${isActive ? 'var(--accent)' : 'white'}"><i class="fas ${isActive ? 'fa-folder-open' : 'fa-folder'}"></i> ${projName}</h4>
                            <p class="wgs-coords">${count} Nokta Kayıtlı</p>
                        </div>
                        <div class="card-actions">
                            ${!isActive ? `<button class="btn-select" onclick="setActiveProject('${projName}')">Seç</button>` : `<span style="color:var(--accent); font-size:0.85rem; padding-right:5px;"><i class="fas fa-check-circle"></i> Aktif</span>`}
                        </div>
                    </div>
                `;
            }
            document.getElementById('projects-list').innerHTML = html;
        }

        function saveCurrentLocation() {
            if (!currentLat) { alert("GPS bekleniyor..."); return; }
            var nameInput = document.getElementById("point-name");
            var ptName = nameInput.value.trim();
            if (!ptName) { alert("Nokta adı girin!"); return; }

            var id = pointIdCounter++;
            
            projectsData[activeProject].points.push({ 
                id: id, name: ptName, lat: currentLat, lon: currentLon, y_saga: currentY, x_yukari: currentX, dom: currentDOM 
            });
            
            if(ptName === projectsData[activeProject].autoCounter.toString()) {
                projectsData[activeProject].autoCounter++;
            }
            
            renderActiveProjectMarkers(); // Yeni noktayı haritaya bas
            switchTab('tab-map');
        }

        function editPoint(id) {
            let point = projectsData[activeProject].points.find(p => p.id === id);
            if(point) {
                let newName = prompt("Yeni Nokta Adını Girin:", point.name);
                if(newName && newName.trim() !== "") {
                    point.name = newName.trim();
                    renderActiveProjectMarkers(); // İsmi değiştiği için pop-up'ları tekrar renderla
                    updateListUI();
                }
            }
        }

        function deletePoint(id) {
            if(confirm("Noktayı silmek istediğinize emin misiniz?")) {
                projectsData[activeProject].points = projectsData[activeProject].points.filter(p => p.id !== id);
                renderActiveProjectMarkers(); // Silineni haritadan uçur
                updateListUI();
            }
        }

        function zoomToPoint(lat, lon) { map.setView([lat, lon], 19); switchTab('tab-map'); }

        function updateListUI() {
            var listDiv = document.getElementById("points-list");
            let points = projectsData[activeProject].points;
            
            document.getElementById("list-project-name").innerText = activeProject;
            document.getElementById("point-count").innerText = points.length;
            
            if(points.length === 0) {
                listDiv.innerHTML = '<div class="empty-state"><i class="fas fa-map-marker-alt"></i><p>Bu projede kayıtlı nokta yok.</p></div>';
                return;
            }
            
            let html = "";
            [...points].reverse().forEach(p => {
                html += `
                    <div class="card-item">
                        <div class="card-info">
                            <h4>${p.name}</h4>
                            <p class="itrf-coords">Y: ${p.y_saga.toFixed(3)} <br> X: ${p.x_yukari.toFixed(3)}</p>
                            <p class="wgs-coords">E: ${p.lat.toFixed(6)} / B: ${p.lon.toFixed(6)}</p>
                        </div>
                        <div class="card-actions">
                            <button class="btn-go" onclick="zoomToPoint(${p.lat}, ${p.lon})"><i class="fas fa-crosshairs"></i></button>
                            <button class="btn-edit" onclick="editPoint(${p.id})"><i class="fas fa-pencil-alt"></i></button>
                            <button class="btn-del" onclick="deletePoint(${p.id})"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>`;
            });
            listDiv.innerHTML = html;
        }

        function exportToTXT() {
            let points = projectsData[activeProject].points;
            if(points.length === 0) return alert("Dışa aktarılacak nokta bulunamadı!");
            
            let txtContent = "";
            points.forEach(p => { txtContent += `${p.name} ${p.y_saga.toFixed(3)} ${p.x_yukari.toFixed(3)}\n`; });
            
            let blob = new Blob([txtContent], { type: "text/plain;charset=utf-8" });
            let link = document.createElement("a"); link.href = URL.createObjectURL(blob);
            link.download = `${activeProject.replace(/\s+/g, '_')}_olcumleri.txt`;
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }

        document.getElementById('active-project-label').innerText = activeProject;
    </script>
</body>
</html>
